[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telopauto"
version = "2.0.0"
description = "音声から日本語字幕(SRT)を自動生成する Telop Auto の処理本体"
requires-python = ">=3.9"
# PyTorch / NumPy / transformers は Colab に入っているものをそのまま使う
# (ここに書くと入れ替えが起きてセッションの再起動が必要になるため、あえて書かない)
dependencies = [
    "faster-whisper>=1.1",
    "janome>=0.5",
    "google-genai>=1.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["telopauto"]
